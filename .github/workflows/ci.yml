name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Check out the post-merge state on PRs so CI validates what will land on main,
# not just the branch tip. Falls back to the commit SHA on push/workflow_dispatch.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

jobs:
  # ── Path-change detection ─────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      sensor-daemon: ${{ steps.filter.outputs.sensor-daemon }}
      infra: ${{ steps.filter.outputs.infra }}
      web: ${{ steps.filter.outputs.web }}
      esp32: ${{ steps.filter.outputs.esp32 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            sensor-daemon:
              - 'embedded/pi/sensor-daemon/**'
              - '.github/workflows/ci.yml'
              - '.tool-versions'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'
              - '.tool-versions'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
              - '.tool-versions'
            esp32:
              - 'embedded/esp32/**'
              - '.github/workflows/ci.yml'
              - '.tool-versions'

  # ── Toolchain pins (.tool-versions is the single source of truth) ──────────
  # setup-node, setup-python and the Rust step read .tool-versions directly.
  # pnpm/action-setup reads package.json "packageManager" instead, and infra runs
  # Biome at its biome.json $schema version, so check those agree with the pins.
  toolchain:
    name: Toolchain pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Check pins agree with .tool-versions
        run: |
          status=0
          pnpm_pin="$(awk '$1 == "pnpm" { print $2 }' .tool-versions)"
          for pkg in web/package.json infra/package.json; do
            pm="$(jq -r '.packageManager // empty' "$pkg")"
            if [[ -n "$pm" && "$pm" != "pnpm@${pnpm_pin}" ]]; then
              echo "::error file=${pkg}::packageManager is ${pm} but .tool-versions pins pnpm ${pnpm_pin}"
              status=1
            fi
          done
          biome_schema() { jq -r '."$schema"' "$1" | sed -E 's#.*/schemas/([^/]+)/schema\.json#\1#'; }
          web_biome="$(biome_schema web/biome.json)"
          infra_biome="$(biome_schema infra/biome.json)"
          if [[ "$web_biome" != "$infra_biome" ]]; then
            echo "::error file=infra/biome.json::Biome ${infra_biome} differs from web/biome.json (${web_biome})"
            status=1
          fi
          exit "$status"

  # ── Rust / Sensor daemon ──────────────────────────────────────────────────────
  sensor-daemon:
    name: Sensor daemon (Rust)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sensor-daemon == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      # The toolchain is pinned in .tool-versions (asdf `rust` line), so CI and
      # local builds agree on rustfmt and clippy behaviour.
      - name: Read Rust version from .tool-versions
        id: rust
        run: echo "version=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: llvm-tools-preview, clippy, rustfmt

      - name: Cache Cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            embedded/pi/sensor-daemon/target
          key: ${{ runner.os }}-cargo-sensor-daemon-${{ steps.rust.outputs.version }}-${{ hashFiles('embedded/pi/sensor-daemon/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sensor-daemon-${{ steps.rust.outputs.version }}-

      - name: Format check (rustfmt)
        working-directory: embedded/pi/sensor-daemon
        run: cargo fmt --check

      # Default features only: `real-sensor` pulls in the Pi I²C drivers, which
      # are built on the Pi and not on the runner.
      - name: Lint (clippy)
        working-directory: embedded/pi/sensor-daemon
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test + coverage
        working-directory: embedded/pi/sensor-daemon
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Check coverage threshold (70%)
        working-directory: embedded/pi/sensor-daemon
        run: cargo llvm-cov report --fail-under-lines 70

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: sensor-daemon-coverage
          path: embedded/pi/sensor-daemon/lcov.info

  # ── TypeScript / CDK + Lambda ─────────────────────────────────────────────────
  infra:
    name: Infra (CDK / Lambda)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      # pnpm (version pinned via infra/package.json "packageManager"). Must
      # precede setup-node so its cache can key off the pnpm store.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: infra
        run: pnpm exec tsc --noEmit

      # Biome is run at the version infra/biome.json declares in its $schema
      # (kept equal to web's by the toolchain job), rather than as an infra
      # devDependency.
      - name: Lint + format check (Biome)
        working-directory: infra
        run: |
          BIOME_VERSION="$(jq -r '."$schema"' biome.json | sed -E 's#.*/schemas/([^/]+)/schema\.json#\1#')"
          pnpm dlx "@biomejs/biome@${BIOME_VERSION}" ci .

      - name: Test + coverage
        working-directory: infra
        run: pnpm test

  # ── CDK synth (validates template on PRs and pushes) ─────────────────────────
  synth-infra:
    name: CDK synth
    runs-on: ubuntu-latest
    needs: [changes, infra]
    if: |
      (needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.infra.result == 'success'
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-nakostat-github-ci-sandbox
          aws-region: eu-west-2
      - name: CDK synth (sandbox)
        run: pnpm run ci-synth-sandbox --output cdk-synth.out

  # ── Infra version (shared nakomis deployment tracker) ────────────────────────
  # Computed once from the tracker (project `nakostat-infra`) and handed to both
  # deploy jobs as an artifact, so sandbox and prod deploy the same version. The
  # bump comes from a line that is exactly --bump-major / --bump-minor in the
  # merged commit message (patch otherwise). See nakomis-infra
  # .github/actions/README.md.
  version-infra:
    name: Compute infra version
    runs-on: ubuntu-latest
    needs: [changes, synth-infra]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.synth-infra.result == 'success'
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-nakostat-github-ci-sandbox
          aws-region: eu-west-2
      - name: Compute version
        id: version
        uses: nakomis/nakomis-infra/.github/actions/compute-version@main
        with:
          project: nakostat-infra
          version-file: infra/version.json
      - uses: actions/upload-artifact@v7
        with:
          name: infra-version
          path: infra/version.json

  # ── Deploy to sandbox (auto on merge to main) ─────────────────────────────────
  deploy-infra-sandbox:
    name: Deploy — sandbox
    runs-on: ubuntu-latest
    needs: [changes, synth-infra, version-infra]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.synth-infra.result == 'success' &&
      needs.version-infra.result == 'success'
    environment: sandbox
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Fetch computed version
        uses: actions/download-artifact@v8
        with:
          name: infra-version
          path: infra
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-nakostat-github-ci-sandbox
          aws-region: eu-west-2
      - name: Deploy to sandbox
        run: pnpm run ci-deploy-sandbox
      - name: Record deployment (sandbox)
        uses: nakomis/nakomis-infra/.github/actions/record-deployment@main
        with:
          project: nakostat-infra
          environment: sandbox
          version-file: infra/version.json

  # ── Deploy to prod (manual approval required) ────────────────────────────────
  deploy-infra-prod:
    name: Deploy — production
    runs-on: ubuntu-latest
    needs: [changes, version-infra, deploy-infra-sandbox]
    if: |
      github.event_name == 'push' &&
      needs.changes.outputs.infra == 'true' &&
      needs.deploy-infra-sandbox.result == 'success'
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # The same version sandbox deployed — never recomputed for prod.
      - name: Fetch computed version
        uses: actions/download-artifact@v8
        with:
          name: infra-version
          path: infra
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::637423226886:role/nakomis-nakostat-github-ci-prod
          aws-region: eu-west-2
      - name: Deploy to production
        run: pnpm run ci-deploy-prod
      - name: Record deployment (prod)
        uses: nakomis/nakomis-infra/.github/actions/record-deployment@main
        with:
          project: nakostat-infra
          environment: prod
          version-file: infra/version.json

  # ── React / Web dashboard ─────────────────────────────────────────────────────
  web:
    name: Web dashboard (React)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      # pnpm (version pinned via web/package.json "packageManager"). Must precede
      # setup-node so its npm cache can key off the pnpm store.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      # No ~/.npmrc on the runner, so pnpm resolves from npmjs. The lockfile is
      # registry-agnostic (integrity only), so this is the same tree a dev gets
      # resolving through the home Nexus proxy — see web/README.md.
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint + format check (Biome)
        working-directory: web
        run: pnpm lint

      # config.json holds real per-env values (gitignored, written by
      # set-config.sh on deploy). The lint/test/build job has no AWS access, so
      # seed a placeholder from the committed template purely to satisfy the
      # `import './config.json'` that config.ts performs at test and build time.
      - name: Seed placeholder config
        working-directory: web
        run: cp src/config/config.json.template src/config/config.json

      - name: Unit + component tests with coverage
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build

  # ── Web version (shared nakomis deployment tracker) ──────────────────────────
  # Same pattern as version-infra: computed once and handed to both web deploy
  # jobs as an artifact, so sandbox and prod deploy the same version. The tracker
  # project is read from TRACKER_PROJECT in web/src/api/deployment-tracker.ts,
  # so what CI records is exactly what the footer's "deployed" badge reads back.
  version-web:
    name: Compute web version
    runs-on: ubuntu-latest
    needs: [changes, web]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.web.result == 'success'
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      project: ${{ steps.project.outputs.project }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Read tracker project
        id: project
        run: |
          project="$(sed -nE "s/^export const TRACKER_PROJECT = '([^']+)';$/\1/p" web/src/api/deployment-tracker.ts)"
          if [[ -z "$project" ]]; then
            echo "::error file=web/src/api/deployment-tracker.ts::TRACKER_PROJECT not found"
            exit 1
          fi
          echo "project=${project}" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-nakostat-github-ci-sandbox
          aws-region: eu-west-2
      - name: Compute version
        id: version
        uses: nakomis/nakomis-infra/.github/actions/compute-version@main
        with:
          project: ${{ steps.project.outputs.project }}
          version-file: web/src/version.json
      - uses: actions/upload-artifact@v7
        with:
          name: web-version
          path: web/src/version.json

  # ── Deploy web to sandbox (auto on merge to main) ────────────────────────────
  # A job whose needs include a skipped job is itself skipped unless its `if`
  # carries a status function, so without !cancelled() a web-only change (which
  # skips deploy-infra-sandbox) never deployed web. A skipped infra deploy is
  # only accepted when infra was not meant to deploy, so a combined change whose
  # infra tests fail still holds web back.
  deploy-web-sandbox:
    name: Deploy web — sandbox
    runs-on: ubuntu-latest
    needs: [changes, web, version-web, deploy-infra-sandbox]
    if: |
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.web.result == 'success' &&
      needs.version-web.result == 'success' &&
      (needs.deploy-infra-sandbox.result == 'success' ||
        (needs.deploy-infra-sandbox.result == 'skipped' &&
          needs.changes.outputs.infra != 'true' && github.event_name != 'workflow_dispatch'))
    environment: sandbox
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # The version version-web computed — the same one for sandbox and prod.
      - name: Fetch computed version
        uses: actions/download-artifact@v8
        with:
          name: web-version
          path: web/src
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-nakostat-github-ci-sandbox
          aws-region: eu-west-2
      - name: Set config
        run: bash scripts/set-config.sh sandbox
      - name: Build
        run: pnpm build
      - name: Deploy to S3
        run: |
          BUCKET=$(aws ssm get-parameter --name /nakostat/sandbox/web/bucket-name --query Parameter.Value --output text)
          aws s3 sync dist/ "s3://${BUCKET}" --delete
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws ssm get-parameter --name /nakostat/sandbox/web/distribution-id --query Parameter.Value --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
      - name: Record deployment (sandbox)
        uses: nakomis/nakomis-infra/.github/actions/record-deployment@main
        with:
          project: ${{ needs.version-web.outputs.project }}
          environment: sandbox
          version-file: web/src/version.json

  # ── Deploy web to prod (after prod infra deploy) ─────────────────────────────
  # !cancelled() for the same reason: deploy-infra-prod is skipped on web-only
  # changes.
  deploy-web-prod:
    name: Deploy web — production
    runs-on: ubuntu-latest
    needs: [changes, version-web, deploy-web-sandbox, deploy-infra-prod]
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      needs.changes.outputs.web == 'true' &&
      needs.deploy-web-sandbox.result == 'success' &&
      (needs.deploy-infra-prod.result == 'success' ||
        (needs.deploy-infra-prod.result == 'skipped' && needs.changes.outputs.infra != 'true'))
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # The same version sandbox deployed — never recomputed for prod.
      - name: Fetch computed version
        uses: actions/download-artifact@v8
        with:
          name: web-version
          path: web/src
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::637423226886:role/nakomis-nakostat-github-ci-prod
          aws-region: eu-west-2
      - name: Set config
        run: bash scripts/set-config.sh prod
      - name: Build
        run: pnpm build
      - name: Deploy to S3
        run: |
          BUCKET=$(aws ssm get-parameter --name /nakostat/prod/web/bucket-name --query Parameter.Value --output text)
          aws s3 sync dist/ "s3://${BUCKET}" --delete
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws ssm get-parameter --name /nakostat/prod/web/distribution-id --query Parameter.Value --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
      - name: Record deployment (prod)
        uses: nakomis/nakomis-infra/.github/actions/record-deployment@main
        with:
          project: ${{ needs.version-web.outputs.project }}
          environment: prod
          version-file: web/src/version.json

  # ── ESP32 firmware (PlatformIO native unit tests) ─────────────────────────────
  esp32:
    name: ESP32 firmware (native unit tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.esp32 == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .tool-versions

      - name: Install PlatformIO
        run: pip install -r embedded/esp32/requirements.txt

      # The boiler project has no `native` environment yet, so there is nothing
      # host-side to run; this starts testing as soon as one is added.
      - name: Run native unit tests
        working-directory: embedded/esp32/boiler
        run: |
          if ! grep -q '^\[env:native\]' platformio.ini; then
            echo "No [env:native] in platformio.ini — no host-side tests yet, skipping"
            exit 0
          fi
          pio test -e native

  # ── CI Status gate (always runs, allows skipped jobs) ─────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, toolchain, sensor-daemon, infra, synth-infra, web, esp32]
    if: always()
    steps:
      - name: Check CI results
        run: |
          # Fail if any job failed (skip/success are acceptable)
          if [[ "${{ needs.toolchain.result }}" == "failure" ]] || \
             [[ "${{ needs.sensor-daemon.result }}" == "failure" ]] || \
             [[ "${{ needs.infra.result }}" == "failure" ]] || \
             [[ "${{ needs.synth-infra.result }}" == "failure" ]] || \
             [[ "${{ needs.web.result }}" == "failure" ]] || \
             [[ "${{ needs.esp32.result }}" == "failure" ]]; then
            echo "❌ CI checks failed"
            exit 1
          fi
          echo "✅ All CI checks passed or were skipped"
