name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Check out the post-merge state on PRs so CI validates what will land on main,
# not just the branch tip. Falls back to the commit SHA on push/workflow_dispatch.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

jobs:
  # ── Path-change detection ─────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      sensor-daemon: ${{ steps.filter.outputs.sensor-daemon }}
      infra: ${{ steps.filter.outputs.infra }}
      web: ${{ steps.filter.outputs.web }}
      esp32: ${{ steps.filter.outputs.esp32 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sensor-daemon:
              - 'embedded/pi/sensor-daemon/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            esp32:
              - 'embedded/esp32/**'
              - '.github/workflows/ci.yml'

  # ── Rust / Sensor daemon ──────────────────────────────────────────────────────
  sensor-daemon:
    name: Sensor daemon (Rust)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sensor-daemon == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            embedded/pi/sensor-daemon/target
          key: ${{ runner.os }}-cargo-sensor-daemon-${{ hashFiles('embedded/pi/sensor-daemon/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sensor-daemon-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test + coverage
        working-directory: embedded/pi/sensor-daemon
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Check coverage threshold (70%)
        working-directory: embedded/pi/sensor-daemon
        run: cargo llvm-cov report --fail-under-lines 70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: sensor-daemon-coverage
          path: embedded/pi/sensor-daemon/lcov.info

  # ── TypeScript / CDK + Lambda ─────────────────────────────────────────────────
  infra:
    name: Infra (CDK / Lambda)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Test + coverage
        working-directory: infra
        run: npm test

  # ── CDK synth (validates template on PRs and pushes) ─────────────────────────
  synth-infra:
    name: CDK synth
    runs-on: ubuntu-latest
    needs: [changes, infra]
    if: |
      (needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.infra.result == 'success'
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-nakostat-github-ci-sandbox
          aws-region: eu-west-2
      - name: CDK synth (sandbox)
        run: npm run ci-synth-sandbox -- --output cdk-synth.out

  # ── Deploy to sandbox (auto on merge to main) ─────────────────────────────────
  deploy-infra-sandbox:
    name: Deploy — sandbox
    runs-on: ubuntu-latest
    needs: [changes, synth-infra]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.synth-infra.result == 'success'
    environment: sandbox
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-nakostat-github-ci-sandbox
          aws-region: eu-west-2
      - name: Deploy to sandbox
        run: npm run ci-deploy-sandbox

  # ── Deploy to prod (manual approval required) ────────────────────────────────
  deploy-infra-prod:
    name: Deploy — production
    runs-on: ubuntu-latest
    needs: [changes, deploy-infra-sandbox]
    if: |
      github.event_name == 'push' &&
      needs.changes.outputs.infra == 'true' &&
      needs.deploy-infra-sandbox.result == 'success'
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637423226886:role/nakomis-nakostat-github-ci-prod
          aws-region: eu-west-2
      - name: Deploy to production
        run: npm run ci-deploy-prod

  # ── React / Web dashboard ─────────────────────────────────────────────────────
  web:
    name: Web dashboard (React)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint + format check (Biome)
        working-directory: web
        run: npm run lint

      - name: Unit + component tests with coverage
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  # ── Deploy web to sandbox (auto on merge to main) ────────────────────────────
  # KNOWINGLY BROKEN during the web rebuild (epic STAT-52): this job still calls
  # scripts/set-config.sh + scripts/compute-version.sh and syncs build/, all of
  # which moved/changed in the Vite migration. Web deploys are expected to fail
  # until STAT-56 restores the config + version plumbing and switches to dist/.
  deploy-web-sandbox:
    name: Deploy web — sandbox
    runs-on: ubuntu-latest
    needs: [changes, web, deploy-infra-sandbox]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.web.result == 'success' &&
      (needs.deploy-infra-sandbox.result == 'success' || needs.deploy-infra-sandbox.result == 'skipped')
    environment: sandbox
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-nakostat-github-ci-sandbox
          aws-region: eu-west-2
      - name: Compute version
        run: NPM_ENVIRONMENT=sandbox bash scripts/compute-version.sh
      - name: Set config
        run: bash scripts/set-config.sh sandbox
      - name: Build
        run: npm run build
      - name: Deploy to S3
        run: |
          BUCKET=$(aws ssm get-parameter --name /nakostat/sandbox/web/bucket-name --query Parameter.Value --output text)
          aws s3 sync build/ s3://$BUCKET --delete
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws ssm get-parameter --name /nakostat/sandbox/web/distribution-id --query Parameter.Value --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"

  # ── Deploy web to prod (after prod infra deploy) ─────────────────────────────
  deploy-web-prod:
    name: Deploy web — production
    runs-on: ubuntu-latest
    needs: [changes, deploy-web-sandbox, deploy-infra-prod]
    if: |
      github.event_name == 'push' &&
      needs.changes.outputs.web == 'true' &&
      needs.deploy-web-sandbox.result == 'success' &&
      (needs.deploy-infra-prod.result == 'success' || needs.deploy-infra-prod.result == 'skipped')
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637423226886:role/nakomis-nakostat-github-ci-prod
          aws-region: eu-west-2
      - name: Compute version
        run: NPM_ENVIRONMENT=prod bash scripts/compute-version.sh
      - name: Set config
        run: bash scripts/set-config.sh prod
      - name: Build
        run: npm run build
      - name: Deploy to S3
        run: |
          BUCKET=$(aws ssm get-parameter --name /nakostat/prod/web/bucket-name --query Parameter.Value --output text)
          aws s3 sync build/ s3://$BUCKET --delete
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws ssm get-parameter --name /nakostat/prod/web/distribution-id --query Parameter.Value --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"

  # ── ESP32 firmware (PlatformIO native unit tests) ─────────────────────────────
  esp32:
    name: ESP32 firmware (native unit tests)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.esp32 == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run native unit tests
        working-directory: embedded/esp32
        run: |
          if [ ! -f platformio.ini ]; then
            echo "No platformio.ini — ESP32 project not yet initialised, skipping"
            exit 0
          fi
          pio test -e native

  # ── CI Status gate (always runs, allows skipped jobs) ─────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, sensor-daemon, infra, synth-infra, web, esp32]
    if: always()
    steps:
      - name: Check CI results
        run: |
          # Fail if any job failed (skip/success are acceptable)
          if [[ "${{ needs.sensor-daemon.result }}" == "failure" ]] || \
             [[ "${{ needs.infra.result }}" == "failure" ]] || \
             [[ "${{ needs.synth-infra.result }}" == "failure" ]] || \
             [[ "${{ needs.web.result }}" == "failure" ]] || \
             [[ "${{ needs.esp32.result }}" == "failure" ]]; then
            echo "❌ CI checks failed"
            exit 1
          fi
          echo "✅ All CI checks passed or were skipped"
