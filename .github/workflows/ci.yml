name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Check out the post-merge state on PRs so CI validates what will land on main,
# not just the branch tip. Falls back to the commit SHA on push/workflow_dispatch.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

jobs:
  # ── Rust / Pi UI ─────────────────────────────────────────────────────────────
  pi-ui:
    name: Pi UI (Rust)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files_url, 'embedded/pi')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Check for Rust code
        id: check
        run: |
          if [ -f embedded/pi/Cargo.toml ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.check.outputs.has_code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: steps.check.outputs.has_code == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test + coverage
        if: steps.check.outputs.has_code == 'true'
        working-directory: embedded/pi
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Check coverage threshold (70%)
        if: steps.check.outputs.has_code == 'true'
        working-directory: embedded/pi
        run: |
          cargo llvm-cov report --fail-under-lines 70

      - name: Upload coverage report
        if: steps.check.outputs.has_code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pi-coverage
          path: embedded/pi/lcov.info

  # ── TypeScript / CDK + Lambda ─────────────────────────────────────────────────
  infra:
    name: Infra (CDK / Lambda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Check for TS code
        id: check
        run: |
          if [ -f infra/package.json ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check.outputs.has_code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.has_code == 'true'
        working-directory: infra
        run: npm ci

      - name: Test + coverage
        if: steps.check.outputs.has_code == 'true'
        working-directory: infra
        run: npm test

  # ── CDK synth (validates template on PRs and pushes) ─────────────────────────
  synth-infra:
    name: CDK synth
    runs-on: ubuntu-latest
    needs: infra
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-nakostat-github-ci-sandbox
          aws-region: eu-west-2
      - name: CDK synth (sandbox)
        run: npm run ci-synth-sandbox -- --output cdk-synth.out

  # ── Deploy to sandbox (auto on merge to main) ─────────────────────────────────
  deploy-infra-sandbox:
    name: Deploy — sandbox
    runs-on: ubuntu-latest
    needs: synth-infra
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: sandbox
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-nakostat-github-ci-sandbox
          aws-region: eu-west-2
      - name: Deploy to sandbox
        run: npm run ci-deploy-sandbox

  # ── Deploy to prod (manual approval required) ────────────────────────────────
  deploy-infra-prod:
    name: Deploy — production
    runs-on: ubuntu-latest
    needs: deploy-infra-sandbox
    if: github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637423226886:role/nakomis-nakostat-github-ci-prod
          aws-region: eu-west-2
      - name: Deploy to production
        run: npm run ci-deploy-prod

  # ── React / Web dashboard ─────────────────────────────────────────────────────
  web:
    name: Web dashboard (React)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Check for web code
        id: check
        run: |
          if [ -f web/package.json ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check.outputs.has_code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.has_code == 'true'
        working-directory: web
        run: npm ci

      - name: Configure AWS credentials (sandbox)
        if: steps.check.outputs.has_code == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-nakostat-github-ci-sandbox
          aws-region: eu-west-2

      - name: Verify set-config.sh (sandbox)
        if: steps.check.outputs.has_code == 'true'
        working-directory: web
        run: |
          # Skip if sandbox infra hasn't been deployed yet (bootstrapping a fresh account,
          # or a PR that adds new SSM params before they've been deployed).
          # The deploy pipeline guarantees deploy-infra-sandbox runs before deploy-web-sandbox.
          if ! aws ssm get-parameter --name /nakostat/sandbox/cognito/user-pool-id > /dev/null 2>&1; then
            echo "Skipping: sandbox infra not yet deployed — params will exist after first deploy"
            exit 0
          fi
          bash scripts/set-config.sh sandbox

      - name: Unit + component tests with coverage
        if: steps.check.outputs.has_code == 'true'
        working-directory: web
        run: npm test

      - name: Playwright functional tests
        if: steps.check.outputs.has_code == 'true'
        working-directory: web
        run: npx playwright test --pass-with-no-tests

  # ── Deploy web to sandbox (auto on merge to main) ────────────────────────────
  deploy-web-sandbox:
    name: Deploy web — sandbox
    runs-on: ubuntu-latest
    needs: [web, deploy-infra-sandbox]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: sandbox
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-nakostat-github-ci-sandbox
          aws-region: eu-west-2
      - name: Compute version
        run: NPM_ENVIRONMENT=sandbox bash scripts/compute-version.sh
      - name: Set config
        run: bash scripts/set-config.sh sandbox
      - name: Build
        run: npm run build
      - name: Deploy to S3
        run: |
          BUCKET=$(aws ssm get-parameter --name /nakostat/sandbox/web/bucket-name --query Parameter.Value --output text)
          aws s3 sync build/ s3://$BUCKET --delete
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws ssm get-parameter --name /nakostat/sandbox/web/distribution-id --query Parameter.Value --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"

  # ── Deploy web to prod (after prod infra deploy) ─────────────────────────────
  deploy-web-prod:
    name: Deploy web — production
    runs-on: ubuntu-latest
    needs: [deploy-web-sandbox, deploy-infra-prod]
    if: github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637423226886:role/nakomis-nakostat-github-ci-prod
          aws-region: eu-west-2
      - name: Compute version
        run: NPM_ENVIRONMENT=prod bash scripts/compute-version.sh
      - name: Set config
        run: bash scripts/set-config.sh prod
      - name: Build
        run: npm run build
      - name: Deploy to S3
        run: |
          BUCKET=$(aws ssm get-parameter --name /nakostat/prod/web/bucket-name --query Parameter.Value --output text)
          aws s3 sync build/ s3://$BUCKET --delete
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws ssm get-parameter --name /nakostat/prod/web/distribution-id --query Parameter.Value --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"

  # ── ESP32 firmware (PlatformIO native unit tests) ─────────────────────────────
  esp32:
    name: ESP32 firmware (native unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Check for firmware code
        id: check
        run: |
          if [ -f embedded/esp32/platformio.ini ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.has_code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        if: steps.check.outputs.has_code == 'true'
        run: pip install platformio

      - name: Run native unit tests
        if: steps.check.outputs.has_code == 'true'
        working-directory: embedded/esp32
        run: pio test -e native
