[package]
name = "nakostat-sensor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nakostat-sensor"
path = "src/main.rs"

[features]
default = []
# Enable when cross-compiling for the Pi; not needed for host-side tests
real-sensor = ["linux-embedded-hal", "ens160", "aht20-driver"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rumqttc = { version = "0.25", features = ["use-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "0.26"

# Real I²C sensor drivers — only needed on Pi
linux-embedded-hal = { version = "0.4", optional = true }
ens160 = { version = "0.3", optional = true }
aht20-driver = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
