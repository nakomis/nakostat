[package]
name = "nakostat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "nakostat"
path = "src/main.rs"

[features]
default = []
# Enable when cross-compiling for the Pi; not needed for host-side tests
real-sensor = ["linux-embedded-hal", "ens160", "aht20-driver"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
rustls-pemfile = "2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0"

# Real I²C sensor drivers — only needed on Pi
# Only the I²C backend is used; skipping the serial/GPIO/SPI defaults avoids
# pulling in libudev, which would need a cross pkg-config sysroot.
linux-embedded-hal = { version = "0.5", default-features = false, features = ["i2c"], optional = true }
ens160 = { version = "0.6", optional = true }
# The default `use-defmt` feature needs a defmt logger, which Linux does not provide.
aht20-driver = { version = "2", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3.27"
